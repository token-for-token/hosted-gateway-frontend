# Local dev — `docker compose up`.
# Runs vite dev with file polling so it doesn't hit the host's inotify limit.
# Source is bind-mounted so edits hot-reload inside the container.

services:
  app:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://api.t4t-gateway.com}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules

volumes:
  frontend-node-modules:
